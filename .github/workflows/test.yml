name: test

on:
  push:
  pull_request:

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - if: runner.os != 'macOS'
        run: python install.py --agent codex --skip-deps
      - name: Verify low-memory refusal on macOS runner
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          output=$(python install.py --agent codex --skip-deps 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          echo "$output" | grep -q "requires at least 8 GB"
